; Compile-only coverage for every viable device environment in
; freeink-sdk/platformio.sample.ini. Keep this file standalone so it can be
; copied/run from this directory without changing the firmware project.

[platformio]
default_envs = xteink

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
build_unflags = -std=gnu++11
board_build.flash_mode = dio
board_build.flash_size = 16MB
lib_deps =
  BoardConfig=symlink://../../freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://../../freeink-sdk/libs/display/FreeInkDisplay

[env:xteink]
extends = base
board = esp32-c3-devkitm-1
build_flags = ${base.build_flags}
  -DFREEINK_DEVICE_X3=1
  -DFREEINK_DEVICE_X4=1

[env:xteink_x4]
extends = base
board = esp32-c3-devkitm-1
build_flags = ${base.build_flags}
  -DFREEINK_DEVICE_X4=1

[env:m5paper]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_flags = ${base.build_flags}
  -DFREEINK_DEVICE_M5=1

[env:m5paper_official]
extends = env:m5paper
build_flags = ${env:m5paper.build_flags}
  -DFREEINK_M5_OFFICIAL=1
lib_deps = ${env:m5paper.lib_deps}
  m5stack/M5Unified
  m5stack/M5GFX
  m5stack/M5PM1

[env:delink]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags = ${base.build_flags}
  -DFREEINK_DEVICE_DELINK=1
  -DUSE_BLOCK_DEVICE_INTERFACE=1

[env:murphy]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags = ${base.build_flags}
  -DFREEINK_DEVICE_MURPHY=1

[env:m5paper_v11]
extends = base
board = esp32dev
board_build.mcu = esp32
board_build.flash_mode = qio
build_flags = ${base.build_flags}
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_M5PAPER=1

[env:papers3]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_flags = ${base.build_flags}
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_PAPERS3=1
lib_deps = ${base.lib_deps}
  BoardPaperS3=symlink://../../freeink-sdk/libs/hardware/BoardPaperS3
  m5stack/M5GFX @ 0.2.20

[env:eego_a4]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
build_flags = ${base.build_flags}
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_EEGO_A4=1

[env:sticky]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags = ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1

[env:x4c]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags = ${base.build_flags}
  -DBOARD_HAS_PSRAM
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DFREEINK_DEVICE_X4CLASSIC=1

[env:papermono]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags = ${base.build_flags}
  -DBOARD_HAS_PSRAM
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DFREEINK_DEVICE_PAPERMONO=1
