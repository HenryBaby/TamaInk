name: Firmware

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x3:
    name: Build Xteink X3 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned PlatformIO
        run: python -m pip install --requirement requirements.txt

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build and validate firmware
        run: pio run -e x3

      - name: Preserve first build
        run: cp .pio/build/x3/firmware.bin "$RUNNER_TEMP/firmware-first.bin"

      - name: Rebuild from clean output
        run: |
          pio run -e x3 --target clean
          pio run -e x3

      - name: Verify reproducible application image
        run: |
          cmp "$RUNNER_TEMP/firmware-first.bin" .pio/build/x3/firmware.bin
          sha256sum .pio/build/x3/firmware.bin

      - name: Upload application image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tamaink-x3-${{ github.sha }}
          path: .pio/build/x3/firmware.bin
          if-no-files-found: error
          retention-days: 14

