name: Firmware
run-name: ${{ inputs.run_name || github.event.pull_request.title || github.event.head_commit.message }}

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      run_name:
        description: Conventional Commit title shown in the Actions run list
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x3:
    name: Containerized host tests and X3 firmware build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build pinned test image
        run: docker compose build

      - name: Run host suite, reproducibility validation, and artifact export
        run: |
          mkdir -p "$RUNNER_TEMP/tamaink-output"
          docker compose run --rm \
            -e TAMAINK_OUTPUT=/output \
            -v "$RUNNER_TEMP/tamaink-output:/output" \
            test

      - name: Upload application image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tamaink-x3-${{ github.sha }}
          path: ${{ runner.temp }}/tamaink-output/firmware.bin
          if-no-files-found: error
          retention-days: 14
